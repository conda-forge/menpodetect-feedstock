{% set name = "menpodetect" %}
{% set version = "0.7.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5fe2f30e0a79821611b4d5d614c7b72bbe743ee322afda76469cb8a521559bd9

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - python >=3.7
    - pip

  run:
    - python >=3.7
    - dlib
    - menpo
    - opencv

test:
  requires:
    - libopencv *=headless*  # [linux]

  imports:
    - menpodetect
    - menpodetect.dlib
    - menpodetect.opencv

about:
  home: https://github.com/menpo/menpodetect
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: The Menpo Project Python package for detecting faces
  description: |
    MenpoDetect is a Menpo Project package for detecting faces in images.

extra:
  recipe-maintainers:
    - patricksnape
