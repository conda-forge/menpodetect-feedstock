{% set name = "menpodetect" %}
{% set version = "0.7.1" %}
# conda-forge builds Python 3.11-3.14, and menpo (>=0.12) needs 3.11; the noarch test
# environment is solved at python_min
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5fe2f30e0a79821611b4d5d614c7b72bbe743ee322afda76469cb8a521559bd9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - menpo >=0.12
    - dlib
    # the conda-forge opencv package is built with opencv_contrib, which the Haar cascade
    # detectors need from OpenCV 5 on (cv2.CascadeClassifier)
    - opencv >=4.5

test:
  imports:
    - menpodetect
    - menpodetect.dlib
    - menpodetect.opencv
  requires:
    - python {{ python_min }}.*
    - pip
    - pytest >=8
    - pytest-mock
    - libopencv *=headless*  # [linux]
  commands:
    - pip check
    # runs the real dlib and OpenCV detectors on the bundled takeo image
    - pytest --pyargs menpodetect -v

about:
  home: https://github.com/menpo/menpodetect
  dev_url: https://github.com/menpo/menpodetect
  doc_url: https://menpodetect.readthedocs.io/en/stable/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: The Menpo Project Python package for detecting faces
  description: |
    MenpoDetect is a Menpo Project package for detecting faces in images.

extra:
  recipe-maintainers:
    - patricksnape
